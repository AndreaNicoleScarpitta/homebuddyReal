name: Staging smoke verification
on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character staging deployment commit
        required: true
        type: string

jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Validate live staging deployment (read-only)
        env:
          STAGING_BASE_URL: https://homebuddy-web-staging.up.railway.app
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.expected_sha }}
        run: node script/verify-staging.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise live staging account and document lifecycle
        env:
          STAGING_BASE_URL: https://homebuddy-web-staging.up.railway.app
        run: npm run test:e2e -- e2e/staging-journey.spec.ts
