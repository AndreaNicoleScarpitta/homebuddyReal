name: CI

# Require every critical job to succeed before a release is eligible for merge.
# GitHub branch rules must require the `release-gate` check on main.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: home_buddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/home_buddy
      NODE_ENV: test
      PORT: 5000
      SESSION_SECRET: ci-test-secret-not-for-production
      ALLOW_TEST_USER_HEADER: "1"
      AI_INTEGRATIONS_OPENAI_API_KEY: sk-test-ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Start server for integration tests
        run: npx tsx server/index.ts &
      - name: Wait for server to be ready
        run: npx wait-on http://localhost:5000/api/health --timeout 90000
      - run: npm test -- --reporter=verbose

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: home_buddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/home_buddy
      NODE_ENV: development
      PORT: 5000
      SESSION_SECRET: ci-e2e-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run build
      - name: Start server & run E2E tests
        run: |
          NODE_ENV=production node dist/index.cjs &
          npx wait-on http://localhost:5000/api/health --timeout 30000
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /tmp/homebuddy-ci.key -out /tmp/homebuddy-ci.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" 2>/dev/null
          node script/ci-https-proxy.mjs &
          NODE_TLS_REJECT_UNAUTHORIZED=0 npx wait-on https://localhost:5443/api/health --timeout 30000
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligent-home-review-screenshots
          path: test-results/my-house-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  # Only the exact running staging commit can be promoted to main.
  # This job skips on staging pushes/PRs, and must pass for main PRs.
  staging-promotion:
    name: staging-promotion
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Enforce staging-to-main promotion only
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEST_REPO: ${{ github.repository }}
        run: |
          if [ "$SOURCE_BRANCH" != "staging" ] || [ "$SOURCE_REPO" != "$DEST_REPO" ]; then
            echo "::error::Production PRs must originate from this repository's staging branch."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Verify staging is healthy and serving the exact proposed commit
        env:
          STAGING_BASE_URL: https://homebuddy-web-staging.up.railway.app
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: node script/verify-staging.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run real staging homeowner and document lifecycle
        env:
          STAGING_BASE_URL: https://homebuddy-web-staging.up.railway.app
        run: npm run test:e2e -- e2e/staging-journey.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: staging-browser-failures
          path: playwright-report/
          if-no-files-found: ignore

  # Single stable required check. `if: always()` means cancelled or
  # missing upstream jobs cannot silently register a success.
  release-gate:
    name: release-gate
    if: always()
    needs: [lint-and-typecheck, test, e2e, build, staging-promotion]
    runs-on: ubuntu-latest
    steps:
      - name: Refuse release if any critical check failed or was skipped
        env:
          LINT: ${{ needs.lint-and-typecheck.result }}
          TEST: ${{ needs.test.result }}
          E2E: ${{ needs.e2e.result }}
          BUILD: ${{ needs.build.result }}
          PROMOTION: ${{ needs.staging-promotion.result }}
          EVENT: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          echo "typecheck=$LINT, unit-api=$TEST, browser=$E2E, build=$BUILD"
          for status in "$LINT" "$TEST" "$E2E" "$BUILD"; do
            if [ "$status" != "success" ]; then
              echo "::error::Release blocked. All critical CI jobs must succeed."
              exit 1
            fi
          done
          if [ "$EVENT" = "pull_request" ] && [ "$BASE_BRANCH" = "main" ] && [ "$PROMOTION" != "success" ]; then
            echo "::error::Staging verification did not pass; production promotion blocked."
            exit 1
          fi
          echo "All release checks passed."
