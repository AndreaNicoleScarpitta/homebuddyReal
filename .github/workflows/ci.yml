name: CI

# Require every critical job to succeed before a release is eligible for merge.
# GitHub branch rules must require the `release-gate` check on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: home_buddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/home_buddy
      NODE_ENV: test
      PORT: 5000
      SESSION_SECRET: ci-test-secret-not-for-production
      ALLOW_TEST_USER_HEADER: "1"
      AI_INTEGRATIONS_OPENAI_API_KEY: sk-test-ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Start server for integration tests
        run: npx tsx server/index.ts &
      - name: Wait for server to be ready
        run: npx wait-on http://localhost:5000/api/health --timeout 90000
      - run: npx vitest run --reporter=verbose

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: home_buddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/home_buddy
      NODE_ENV: development
      PORT: 5000
      SESSION_SECRET: ci-e2e-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run build
      - name: Start server & run E2E tests
        run: |
          NODE_ENV=production node dist/index.cjs &
          npx wait-on http://localhost:5000/api/health --timeout 30000
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligent-home-review-screenshots
          path: test-results/my-house-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  # Single stable required check. `if: always()` means cancelled or
  # missing upstream jobs cannot silently register a success.
  release-gate:
    name: release-gate
    if: always()
    needs: [lint-and-typecheck, test, e2e, build]
    runs-on: ubuntu-latest
    steps:
      - name: Refuse release if any critical check failed or was skipped
        env:
          LINT: ${{ needs.lint-and-typecheck.result }}
          TEST: ${{ needs.test.result }}
          E2E: ${{ needs.e2e.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "typecheck=$LINT, unit-api=$TEST, browser=$E2E, build=$BUILD"
          for status in "$LINT" "$TEST" "$E2E" "$BUILD"; do
            if [ "$status" != "success" ]; then
              echo "::error::Release blocked. All critical CI jobs must succeed."
              exit 1
            fi
          done
          echo "All release checks passed."
