# Isolated local Postgres ONLY. Production and staging run on Railway.
# Run: docker compose up -d postgres
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: home_buddy
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d home_buddy"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
